<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,
                 height=device-height,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>ExamQuest</title>

    <style>

        /* =========================================================
           GENERAL
        ========================================================= */

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #000000;

            font-family:
                Arial,
                Helvetica,
                sans-serif;


            /* =====================================================
               PREVENT BROWSER SELECTION / DRAGGING
            ===================================================== */

            user-select: none;
            -webkit-user-select: none;

            -webkit-user-drag: none;

            overscroll-behavior: none;
        }


        /* =========================================================
           UNITY CONTAINER
        ========================================================= */

        #unity-container {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #000000;


            /* Browser selection verhindern */
            user-select: none;
            -webkit-user-select: none;

            -webkit-user-drag: none;
        }


        /* =========================================================
           UNITY CANVAS
        ========================================================= */

        #unity-canvas {
            display: block;

            background: #000000;

            outline: none;


            /* =====================================================
               IMPORTANT FOR UNITY DRAG & DROP
            ===================================================== */

            user-select: none;
            -webkit-user-select: none;

            -webkit-user-drag: none;

            /*
             * Verhindert Browser-/Touch-Gesten,
             * während Unity Eingaben verarbeitet.
             */
            touch-action: none;
        }


        /* =========================================================
           LOADING SCREEN
        ========================================================= */

        #loading-overlay {

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 420px;
            max-width: 70vw;

            text-align: center;

            color: white;

            z-index: 10;

            user-select: none;
            -webkit-user-select: none;
        }


        #loading-title {

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        #progress-background {

            width: 100%;
            height: 16px;

            background:
                rgba(255, 255, 255, 0.25);

            border-radius: 8px;

            overflow: hidden;
        }


        #progress-bar {

            width: 0%;
            height: 100%;

            background: white;

            border-radius: 8px;

            transition:
                width 0.1s linear;
        }


        #progress-text {

            margin-top: 10px;

            font-size: 14px;

            opacity: 0.8;
        }


        /* =========================================================
           FULLSCREEN BUTTON
        ========================================================= */

        #fullscreen-button {

            position: fixed;

            right: 18px;
            bottom: 18px;

            width: 48px;
            height: 48px;

            border: none;

            border-radius: 8px;

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 24px;

            cursor: pointer;

            z-index: 20;

            display: none;

            user-select: none;
            -webkit-user-select: none;

            -webkit-user-drag: none;
        }


        #fullscreen-button:hover {

            background:
                rgba(0, 0, 0, 0.9);
        }


        /* =========================================================
           UNITY WARNING / ERROR
        ========================================================= */

        #unity-warning {

            position: fixed;

            left: 50%;
            top: 20px;

            transform:
                translateX(-50%);

            padding:
                10px 18px;

            max-width: 80%;

            color: white;

            background: #c0392b;

            border-radius: 6px;

            z-index: 100;

            display: none;

            user-select: none;
            -webkit-user-select: none;
        }

    </style>

</head>


<body>


    <!-- =========================================================
         UNITY
    ========================================================== -->

    <div id="unity-container">

        <canvas
            id="unity-canvas"
            width="960"
            height="600"
            tabindex="-1">
        </canvas>


        <!-- =====================================================
             LOADING
        ====================================================== -->

        <div id="loading-overlay">

            <div id="loading-title">
                Loading ExamQuest...
            </div>


            <div id="progress-background">

                <div id="progress-bar">
                </div>

            </div>


            <div id="progress-text">
                0%
            </div>

        </div>

    </div>


    <!-- =========================================================
         FULLSCREEN
    ========================================================== -->

    <button
        id="fullscreen-button"
        title="Fullscreen">
        ⛶
    </button>


    <!-- =========================================================
         WARNINGS
    ========================================================== -->

    <div id="unity-warning">
    </div>



    <!-- =========================================================
         UNITY SCRIPT
    ========================================================== -->

    <script>

        /* =========================================================
           REFERENCES
        ========================================================= */

        const canvas =
            document.querySelector(
                "#unity-canvas"
            );


        const loadingOverlay =
            document.querySelector(
                "#loading-overlay"
            );


        const progressBar =
            document.querySelector(
                "#progress-bar"
            );


        const progressText =
            document.querySelector(
                "#progress-text"
            );


        const fullscreenButton =
            document.querySelector(
                "#fullscreen-button"
            );


        const warningBanner =
            document.querySelector(
                "#unity-warning"
            );



        /* =========================================================
           PREVENT BROWSER SELECTION / NATIVE DRAGGING
        ========================================================= */

        /*
         * Verhindert, dass der Browser beim Ziehen innerhalb
         * des Unity-Spiels versucht, HTML-Elemente oder Bilder
         * selbst zu verschieben.
         */

        document.addEventListener(
            "dragstart",
            function (event) {

                event.preventDefault();
            }
        );


        /*
         * Verhindert die typische blaue Browser-Markierung
         * beim Ziehen mit gedrückter Maustaste.
         */

        document.addEventListener(
            "selectstart",
            function (event) {

                event.preventDefault();
            }
        );


        /*
         * Zusätzlich Browser-eigenes Dragging direkt
         * auf dem Canvas verhindern.
         */

        canvas.addEventListener(
            "dragstart",
            function (event) {

                event.preventDefault();
            }
        );



        /* =========================================================
           UNITY BUILD CONFIGURATION
        ========================================================= */

        const buildUrl =
            "Build";


        const loaderUrl =
            buildUrl
            + "/WebBuild.loader.js";


        const config = {

            dataUrl:
                buildUrl
                + "/WebBuild.data",

            frameworkUrl:
                buildUrl
                + "/WebBuild.framework.js",

            codeUrl:
                buildUrl
                + "/WebBuild.wasm",



            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "DefaultCompany",

            productName:
                "ExamQuest",

            productVersion:
                "0.1.0",

            /*
             * Performancefreundliche Renderauflösung.
             */
            devicePixelRatio:
                1,

            /*
             * Unity passt die tatsächliche WebGL-Auflösung
             * an die CSS-Größe des Canvas an.
             */
            matchWebGLToCanvasSize:
                true
        };



        /* =========================================================
           WARNINGS
        ========================================================= */

        function showUnityBanner(
            message,
            type
        ) {

            warningBanner.innerHTML =
                message;


            warningBanner.style.display =
                "block";


            if (type === "error") {

                warningBanner.style.background =
                    "#c0392b";

            }
            else {

                warningBanner.style.background =
                    "#d68910";


                setTimeout(
                    () => {

                        warningBanner.style.display =
                            "none";

                    },
                    5000
                );
            }
        }


        config.showBanner =
            showUnityBanner;



        /* =========================================================
           RESPONSIVE 16:9 CANVAS
        ========================================================= */

        const TARGET_ASPECT =
            16 / 9;


        function resizeUnityCanvas() {

            const availableWidth =
                window.innerWidth;


            const availableHeight =
                window.innerHeight;


            let width =
                availableWidth;


            let height =
                width / TARGET_ASPECT;


            /*
             * Wenn die berechnete Höhe größer als das
             * Browserfenster ist, an der Höhe orientieren.
             */

            if (
                height >
                availableHeight
            ) {

                height =
                    availableHeight;


                width =
                    height
                    * TARGET_ASPECT;
            }


            width =
                Math.floor(width);


            height =
                Math.floor(height);


            /*
             * Nur CSS-Größe ändern.
             * Unity synchronisiert seine Renderauflösung
             * über matchWebGLToCanvasSize.
             */

            canvas.style.width =
                width + "px";


            canvas.style.height =
                height + "px";
        }



        /* =========================================================
           WINDOW RESIZE
        ========================================================= */

        window.addEventListener(
            "resize",
            resizeUnityCanvas
        );


        /*
         * Bei Fullscreen-Wechsel ebenfalls
         * Canvas neu berechnen.
         */

        document.addEventListener(
            "fullscreenchange",
            resizeUnityCanvas
        );


        /*
         * Safari / ältere WebKit Browser
         */

        document.addEventListener(
            "webkitfullscreenchange",
            resizeUnityCanvas
        );


        resizeUnityCanvas();



        /* =========================================================
           UNITY INSTANCE
        ========================================================= */

        let unityInstance =
            null;



        /* =========================================================
           CREATE UNITY LOADER SCRIPT
        ========================================================= */

        const script =
            document.createElement(
                "script"
            );


        script.src =
            loaderUrl;



        script.onload =
            () => {


                createUnityInstance(

                    canvas,

                    config,


                    /*
                     * Loading Progress
                     */

                    (progress) => {

                        const percentage =
                            Math.round(
                                progress * 100
                            );


                        progressBar.style.width =
                            percentage + "%";


                        progressText.textContent =
                            percentage + "%";
                    }

                )

                .then(
                    (instance) => {


                        unityInstance =
                            instance;


                        /*
                         * Loading Screen entfernen
                         */

                        loadingOverlay.style.display =
                            "none";


                        /*
                         * Fullscreen Button anzeigen
                         */

                        fullscreenButton.style.display =
                            "block";


                        /*
                         * Canvas nochmals korrekt anpassen
                         */

                        resizeUnityCanvas();


                        /*
                         * Fokus an Unity geben
                         */

                        canvas.focus();
                    }
                )

                .catch(
                    (message) => {


                        console.error(
                            message
                        );


                        showUnityBanner(
                            message,
                            "error"
                        );
                    }
                );
            };



        /* =========================================================
           LOAD UNITY
        ========================================================= */

        document.body.appendChild(
            script
        );



        /* =========================================================
           FULLSCREEN BUTTON
        ========================================================= */

        fullscreenButton.addEventListener(

            "click",

            () => {


                if (
                    unityInstance !== null
                ) {

                    unityInstance.SetFullscreen(
                        1
                    );
                }
            }
        );



        /* =========================================================
           UNITY FOCUS
        ========================================================= */

        canvas.addEventListener(

            "mousedown",

            () => {

                canvas.focus();
            }
        );


        /*
         * Auch bei Touch wieder Fokus geben.
         */

        canvas.addEventListener(

            "touchstart",

            () => {

                canvas.focus();
            }
        );


    </script>


</body>

</html>
